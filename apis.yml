name: Marcopolo Learning
description: >-
  MarcoPolo Learning is an award-winning early childhood education technology company, founded in
  2013, that builds premium video content, instructional support, and learning apps for preschool
  and kindergarten. Its products include MarcoPolo For Educators (curriculum-aligned classroom video
  and educator guides), MarcoPolo For Families (Emmy-nominated videos plus literacy and math games),
  MarcoPolo World School (kindergarten readiness), MarcoPolo Professional Development for teachers,
  and The Polos animated series. The company was surfaced as a Seedcamp portfolio company and added
  to the API Evangelist network. As of this enrichment pass MarcoPolo Learning publishes no public
  API, developer portal, or machine-readable developer surface; it is a consumer/educator app
  business, so this profile carries company identity and domain-security signals only.
